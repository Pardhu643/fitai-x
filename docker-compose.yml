version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitaix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitaix_user
      POSTGRES_PASSWORD: fitaix_password
      POSTGRES_DB: fitaix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitaix_user -d fitaix_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
